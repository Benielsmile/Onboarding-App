<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#000000"/>
  <!-- PIGA Symbol: A / STUDIO emblem -->
  <g transform="translate(100, 76) scale(0.62)">
    <!-- Thin outer parallelogram outline -->
    <path d="M 120 40 L 260 40 L 40 460 L -100 460 Z" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linejoin="round"/>
    <!-- Angled red cartouche with STUDIO text in white -->
    <g transform="translate(160, 260) rotate(-45)">
      <rect x="0" y="0" width="220" height="74" rx="8" fill="#E50914"/>
      <text x="110" y="48" font-family="'Inter', sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">STUDIO</text>
    </g>
    <!-- Solid red triangle top -->
    <polygon points="310,210 370,320 250,320" fill="#E50914"/>
  </g>
  <!-- Brand baseline text -->
  <text x="256" y="440" font-family="'Montserrat', sans-serif" font-weight="900" font-size="44" fill="#E50914" text-anchor="middle" letter-spacing="3">PIGA STUDIO</text>
</svg>
